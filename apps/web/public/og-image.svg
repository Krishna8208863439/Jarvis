<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyan/Purple Accents -->
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="300" r="280" fill="url(#glow)" filter="url(#blurFilter)" />
  <circle cx="950" cy="315" r="320" fill="url(#glow)" filter="url(#blurFilter)" />

  <!-- Left Content: Brand & Architecture Description -->
  <!-- Top Badge -->
  <g transform="translate(100, 110)">
    <rect width="260" height="38" rx="19" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#00f0ff" />
    <text x="36" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="2">AUTONOMOUS AI OPERATOR</text>
  </g>

  <!-- Project NOVA Title -->
  <text x="100" y="225" fill="url(#novaGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="4">PROJECT NOVA</text>

  <!-- Full Title -->
  <text x="102" y="275" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" letter-spacing="1.5">Neural Operating &amp; Virtual Assistant</text>

  <!-- Description / Subtitle -->
  <text x="102" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18">Real-world JARVIS AI assistant with continuous voice reasoning,</text>
  <text x="102" y="355" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="18">desktop application control, and multi-step autonomous execution.</text>

  <!-- Capability Badges -->
  <g transform="translate(102, 410)">
    <!-- Voice Pill -->
    <g transform="translate(0, 0)">
      <rect width="175" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🎙 Multilingual Voice</text>
    </g>

    <!-- OS Control Pill -->
    <g transform="translate(190, 0)">
      <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ OS &amp; App Control</text>
    </g>

    <!-- Local AI Pill -->
    <g transform="translate(385, 0)">
      <rect width="165" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🧠 Local AI Runtime</text>
    </g>
  </g>

  <!-- Bottom Footer Info -->
  <g transform="translate(102, 515)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="13">Python FastAPI • Ollama LLM • Tauri &amp; Next.js • Windows UI Automation</text>
  </g>

  <!-- Right Visual: Holographic NOVA Orb & Tech Rings -->
  <g transform="translate(930, 315)">
    <!-- Outer Pulsing Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00f0ff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="14 8" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="2" />

    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="100" fill="url(#orbGlow)" />

    <!-- Central Glowing Core Sphere -->
    <circle cx="0" cy="0" r="70" fill="url(#cyanOrb)" />
    <circle cx="-18" cy="-18" r="28" fill="#ffffff" fill-opacity="0.4" filter="url(#blurFilter)" />

    <!-- Soundwave ticks around Orb -->
    <g stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="-95" y1="0" x2="-80" y2="0" />
      <line x1="80" y1="0" x2="95" y2="0" />
      <line x1="0" y1="-95" x2="0" y2="-80" />
      <line x1="0" y1="80" x2="0" y2="95" />
      <line x1="-65" y1="-65" x2="-55" y2="-55" />
      <line x1="55" y1="55" x2="65" y2="65" />
      <line x1="-65" y1="65" x2="-55" y2="55" />
      <line x1="55" y1="-65" x2="65" y2="-55" />
    </g>

    <!-- Center Status Dot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>

